name: Validate and Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build production site
        run: npm run validate

      - name: Add portable schema, examples, and build provenance
        run: |
          mkdir -p dist/schema dist/examples
          cp schema/manga-blueprint.schema.json dist/schema/
          if [ -d examples ]; then cp -R examples/. dist/examples/; fi
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('web/build-info.json', 'utf8'));
          info.gitCommit = process.env.GITHUB_SHA || null;
          info.buildSource = 'github-pages-vite';
          info.deployedAt = new Date().toISOString();
          fs.writeFileSync('dist/build-info.json', `${JSON.stringify(info, null, 2)}\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
