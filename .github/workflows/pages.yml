name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/schema _site/examples
          cp -R web/. _site/
          cp schema/manga-blueprint.schema.json _site/schema/
          if [ -d examples ]; then cp -R examples/. _site/examples/; fi
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('web/build-info.json', 'utf8'));
          info.gitCommit = process.env.GITHUB_SHA || null;
          info.buildSource = 'github-pages';
          info.deployedAt = new Date().toISOString();
          fs.writeFileSync('_site/build-info.json', `${JSON.stringify(info, null, 2)}\n`);
          NODE

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
