name: One-shot UX polish 0.16.4

on:
  push:
    branches: [work/top-template-work-explorer]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/top-template-work-explorer
          fetch-depth: 0
      - name: Apply polish
        run: python3 scripts/fix-ux-0.16.4.py
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Work Explorer responsive layout'
          git push origin HEAD:work/top-template-work-explorer
