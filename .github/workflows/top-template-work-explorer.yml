          text=rep(text,old_dialog,new_dialog,path)
          text=rep(text,"  $('openStructure17').addEventListener('click',()=>openStructure17());\n  $('currentPageButton17').addEventListener('click',()=>openStructure17());\n  $('currentWorkButton17').addEventListener('click',()=>openWorkLibrary16());","  $('currentPageButton17').addEventListener('click',()=>openStructure17());\n  $('currentWorkButton17').addEventListener('click',()=>openStructure17());\n  $('newWorkExplorer17').addEventListener('click',async()=>{await createWork16();renderEditorShell17();await renderExplorerWorks17();});\n  $('manageWorksExplorer17').addEventListener('click',()=>openWorkLibrary16());\n  $('explorerWorks17').addEventListener('click',async event=>{const button=event.target.closest('[data-explorer-work17]');if(!button)return;const id=button.dataset.explorerWork17;if(id&&id!==project?.meta?.workId)await openStoredWork16(id);renderEditorShell17();await renderExplorerWorks17();});",path)
