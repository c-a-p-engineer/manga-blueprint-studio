          text=rep(text,"  $('addPage17').title=esText17('addPage');$('openStructure17').textContent=esText17('structure');","  $('addPage17').title=esText17('addPage');$('newWorkExplorer17').textContent=esText17('newWork');$('manageWorksExplorer17').textContent=esText17('manageWorks');",path)
