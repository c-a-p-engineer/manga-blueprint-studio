          text=rep(text,"    workLibrary:'作品一覧',structure:'作品構成',pageSettings:'ページ設定',pageOps:'ページ操作',structureEdit:'巻・章・フォルダを編集',","    workLibrary:'作品管理',structure:'作品エクスプローラー',pageSettings:'ページ設定',pageOps:'ページ操作',newWork:'＋ 新しい作品',manageWorks:'作品管理',",path)
          text=rep(text,"    workLibrary:'Works',structure:'Work structure',pageSettings:'Page settings',pageOps:'Page actions',structureEdit:'Edit volumes / chapters / folders',","    workLibrary:'Manage works',structure:'Work explorer',pageSettings:'Page settings',pageOps:'Page actions',newWork:'+ New work',manageWorks:'Manage works',",path)
          text=rep(text,"  return `<details class=\"explorer-group17\" open><summary><span class=\"explorer-kind17\">${escapeXml(containerType17(container.kind))}</span><strong>${escapeXml(container.title||containerType17(container.kind))}</strong><small>${escapeXml(esText17('pageCount',pages.length))}</small></summary><div class=\"explorer-children17\">${pages.map(explorerPageRow17).join('')}${children.map(explorerContainer17).join('')}${!pages.length&&!children.length?`<div class=\"explorer-empty17\">${escapeXml(esText17('emptyGroup'))}</div>`:''}</div></details>`;","  return `<details class=\"explorer-group17\" open><summary><span class=\"explorer-folder17\">▾</span><strong>${escapeXml(container.title||containerType17(container.kind))}</strong><small>${escapeXml(esText17('pageCount',pages.length))}</small></summary><div class=\"explorer-children17\">${pages.map(explorerPageRow17).join('')}${children.map(explorerContainer17).join('')}${!pages.length&&!children.length?`<div class=\"explorer-empty17\">${escapeXml(esText17('emptyGroup'))}</div>`:''}</div></details>`;",path)

          explorer_insert=r'''
async function renderExplorerWorks17(){
