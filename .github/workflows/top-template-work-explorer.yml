          text=rep(text,".structure-tree17{border:1px solid #d8dee8;border-radius:12px;background:#f8fafc;padding:8px}",".work-explorer-grid17{display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);gap:10px}.work-explorer-works17{border:1px solid #d8dee8;border-radius:12px;background:#f8fafc;padding:8px;display:grid;align-content:start;gap:7px}.work-explorer-side-head17{display:grid;gap:6px}.work-explorer-side-head17 button{min-height:38px}.explorer-works17{display:grid;gap:4px;max-height:48vh;overflow:auto}.explorer-work-row17{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px}.explorer-work-row17 strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.explorer-work-row17 small{font-size:10px;color:#64748b}.explorer-work-row17:hover{background:#e2e8f0}.explorer-work-row17.active{background:#111827;color:#fff}.explorer-work-row17.active small{color:#e2e8f0}.work-explorer-manage17{margin-top:3px}.structure-tree17{border:1px solid #d8dee8;border-radius:12px;background:#f8fafc;padding:8px}",path)
          text=rep(text,".explorer-kind17{font-size:10px;font-weight:800;color:#475569;border:1px solid #cbd5e1;border-radius:6px;padding:2px 5px;background:#fff}",".explorer-folder17{font-size:11px;color:#64748b}",path)
          text=rep(text,"  .editor-context-shell17{position:static}.editor-context-main17{padding:8px 10px}.editor-work-title17{font-size:16px;max-width:72vw}.editor-page-line17{grid-template-columns:38px minmax(125px,1fr) 38px 38px auto}","  .editor-context-shell17{position:static}.editor-context-main17{padding:8px 10px}.editor-work-title17{font-size:16px;max-width:88vw}.editor-page-line17{grid-template-columns:38px minmax(125px,1fr) 38px 38px}.work-explorer-grid17{grid-template-columns:1fr}.explorer-works17{max-height:26vh}",path)

