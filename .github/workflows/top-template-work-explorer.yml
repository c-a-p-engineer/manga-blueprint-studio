          new="""    const textLabel=$('storyTemplateText11')?.closest('label');if(textLabel){$('templateTextSlot36').appendChild(textLabel);localizeTemplateDialogueChoice36();}\n    const apply=$('applyStoryTemplate11');if(apply){$('templateApplySlot36').appendChild(apply);apply.hidden=false;apply.classList.add('primary');}"""
          text=rep(text,old,new,path)
          text=rep(text,"  syncTemplateCastPanel36();\n}\n\n// During the final apply only", "  syncTemplateCastPanel36();\n  relocateTemplateWorkflow36();\n}\n\n// During the final apply only",path)
          text=rep(text,"  if(apply){apply.disabled=!tpl||!templatePrimaryCharacterId36||(needsTwo&&!templateSecondaryCharacterId36);apply.dataset.i18n='templateUseWithCast36';apply.textContent=t('templateUseWithCast36');}","  if(apply){apply.hidden=false;apply.classList.add('primary');apply.disabled=!tpl||!templatePrimaryCharacterId36||(needsTwo&&!templateSecondaryCharacterId36);apply.dataset.i18n='templateUseWithCast36';apply.textContent=t('templateUseWithCast36');}",path)
          text=rep(text,"    #storyTemplatePreview11[hidden]{display:none!important}","    #storyTemplatePreview11[hidden],#storyTemplateBlock11[hidden]{display:none!important}\n    .template-workflow-top36{margin:12px 0 14px;padding:12px;border:1px solid #cbd5e1;border-radius:16px;background:#fff}.template-workflow-heading36{margin:0 0 4px}.template-workflow-lead36{margin:0 0 10px}.template-workflow-top36 #templateStudio13{margin:0}.template-workflow-top36 .template-cast-action36{margin-top:12px}.template-workflow-top36 #applyStoryTemplate11{display:block!important;width:100%;min-height:50px;font-size:.9rem}",path)
          text=rep(text,"render=function(){renderBase36();renderStarterCharacterButtons36();syncTemplateCastPanel36();};","render=function(){renderBase36();renderStarterCharacterButtons36();syncTemplateCastPanel36();relocateTemplateWorkflow36();};",path)
          text=rep(text,"applyLanguage=function(){applyLanguageBase36();renderStarterCharacterButtons36();syncTemplateCastPanel36();};","applyLanguage=function(){applyLanguageBase36();renderStarterCharacterButtons36();syncTemplateCastPanel36();localizeTemplateDialogueChoice36();relocateTemplateWorkflow36();};",path)
          text=rep(text,"bindTemplateCastApply36();\nrenderStarterCharacterButtons36();","bindTemplateCastApply36();\nrelocateTemplateWorkflow36();\nrenderStarterCharacterButtons36();",path)
