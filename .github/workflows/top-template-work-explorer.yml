}

'''
          text=rep(text,'function ensureEditorShell17(){',explorer_insert+'function ensureEditorShell17(){',path)
          text=rep(text,"        <button id=\"addPage17\" type=\"button\" class=\"compact17\">＋</button>\n        <button id=\"openStructure17\" type=\"button\" class=\"editor-structure-button17\"></button>","        <button id=\"addPage17\" type=\"button\" class=\"compact17\">＋</button>",path)
          old_dialog="""      <div id=\"structureTree17\" class=\"structure-tree17\"></div>\n      <details class=\"structure-advanced17\"><summary id=\"pageOpsSummary17\"></summary><div id=\"pageManagerSlot17\"></div></details>\n      <details class=\"structure-advanced17\"><summary id=\"structureEditSummary17\"></summary><div id=\"containerManagerSlot17\"></div></details>"""
