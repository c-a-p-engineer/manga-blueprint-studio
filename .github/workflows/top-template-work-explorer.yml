name: One-shot top template and work explorer UX

on:
  push:
    branches: [work/top-template-work-explorer]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/top-template-work-explorer
          fetch-depth: 0
      - name: Apply UX patch
        run: python3 scripts/apply-ux-0.16.4.py
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify template workflow and work explorer UX'
          git push origin HEAD:work/top-template-work-explorer
