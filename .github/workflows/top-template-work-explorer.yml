name: One-shot top template and work explorer UX

on:
  push:
    branches: [work/top-template-work-explorer]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/top-template-work-explorer
          fetch-depth: 0
      - name: Apply UX simplification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def rep(text, old, new, path):
              if old not in text:
                  raise SystemExit(f'{path}: missing anchor {old[:160]!r}')
              return text.replace(old,new,1)
          def sub(text, pattern, repl, path, flags=0):
              out,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{path}: regex matched {n}: {pattern[:160]!r}')
              return out

          # 1) Template workflow: keep one upper surface for layout/dialogue/cast/apply.
          path='web/runtime/integration/template-character-cast.js'; text=read(path)
          text=rep(text,"  templateCastStep36:'テンプレートを使う',","  templateCastStep36:'キャラクターとセリフ',\n  templateWorkflowHeading36:'コマ割り・セリフテンプレート',\n  templateWorkflowLead36:'テンプレートカードでコマ割りと演出を選び、セリフを使うか・誰を出すかを決めて、そのまま適用します。',\n  templateUseDialogue36:'サンプルのセリフ・効果音を使う',",path)
          text=rep(text,"  templateCastLead36:'カードでテンプレートを選んだあと、実際に配置するキャラクターを指定します。選ぶだけではページは変更されません。',","  templateCastLead36:'使用キャラクターを選び、上のチェックでサンプルのセリフ・効果音を使うか決めます。選ぶだけではページは変更されません。',",path)
          text=rep(text,"  templateUseWithCast36:'このキャラクターでテンプレートを使う'","  templateUseWithCast36:'このテンプレートを使う'",path)
          text=rep(text,"  templateCastStep36:'Use template',","  templateCastStep36:'Characters and dialogue',\n  templateWorkflowHeading36:'Layout + dialogue templates',\n  templateWorkflowLead36:'Choose a template card for panel layout/direction, decide whether to use sample dialogue, choose the cast, then apply from the same surface.',\n  templateUseDialogue36:'Use sample dialogue and SFX',",path)
          text=rep(text,"  templateCastLead36:'Choose a template card, then explicitly choose the character(s) it will place. Browsing and choosing characters do not change the page.',","  templateCastLead36:'Choose the cast and whether to use the template sample dialogue/SFX. Browsing and choosing do not change the page.',",path)
          text=rep(text,"  templateUseWithCast36:'Use template with these characters'","  templateUseWithCast36:'Use this template'",path)

          insertion=r'''
function localizeTemplateDialogueChoice36(){
  const checkbox=$('storyTemplateText11'),label=checkbox?.closest('label');if(!label)return;
  const copy=label.querySelector('[data-i18n]')||label.querySelector('span');
  if(copy){copy.dataset.i18n='templateUseDialogue36';copy.textContent=t('templateUseDialogue36');}
}
function relocateTemplateWorkflow36(){
  const pagePanel=document.querySelector('.tool-panel[data-section="page"]'),studio=$('templateStudio13'),action=$('templateCastAction36'),block=$('storyTemplateBlock11');
  if(!pagePanel||!studio||!action)return;
  let host=$('templateWorkflowTop36');
  if(!host){
    host=document.createElement('section');host.id='templateWorkflowTop36';host.className='template-workflow-top36';
    host.innerHTML=`<div id="templateWorkflowHeading36" class="subhead template-workflow-heading36"></div><p id="templateWorkflowLead36" class="help template-workflow-lead36"></p><div id="templateStudioSlot36"></div><div id="templateApplySlotTop36"></div>`;
    const overview=[...pagePanel.querySelectorAll('.subhead')].find(node=>node.dataset.i18n==='panelOverviewHeading');
    if(overview)overview.insertAdjacentElement('beforebegin',host);else pagePanel.appendChild(host);
  }
  $('templateWorkflowHeading36').textContent=t('templateWorkflowHeading36');
  $('templateWorkflowLead36').textContent=t('templateWorkflowLead36');
  $('templateStudioSlot36')?.appendChild(studio);
  $('templateApplySlotTop36')?.appendChild(action);
  localizeTemplateDialogueChoice36();
  const apply=$('applyStoryTemplate11');if(apply){apply.hidden=false;apply.removeAttribute('aria-hidden');apply.classList.add('primary');}
  if(block){block.hidden=true;block.setAttribute('aria-hidden','true');}
}

'''
          text=rep(text,'function injectTemplateCastUi36(){',insertion+'function injectTemplateCastUi36(){',path)
