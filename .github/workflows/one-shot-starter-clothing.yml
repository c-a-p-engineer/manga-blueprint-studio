name: One-shot starter clothing contract

on:
  push:
    branches:
      - "fix/starter-character-clothing-contract"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/starter-character-clothing-contract
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: python scripts/apply-starter-clothing-one-shot.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify focused contracts
        run: |
          npm run typecheck
          npm run build
          node scripts/validate-template-character-cast.mjs
          node scripts/validate-render-brief.mjs
          node scripts/validate-documentation-sync.mjs
          node scripts/validate-version-sync.mjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make starter clothing explicit in AI handoff"
          git push origin HEAD:fix/starter-character-clothing-contract
