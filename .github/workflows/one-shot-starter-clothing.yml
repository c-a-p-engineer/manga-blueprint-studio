name: One-shot starter clothing contract

on:
  push:
    branches: [fix/starter-character-clothing-contract]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starter-character-clothing-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply clothing and handoff contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def replace_once(p, old, new):
              s=read(p)
              if old not in s:
                  raise SystemExit(f'missing expected text in {p}: {old[:120]!r}')
              write(p,s.replace(old,new,1))

          p='web/runtime/integration/template-character-cast.js'
          s=read(p)
          pattern=r"const STARTER_CHARACTER_PRESETS_36=Object\.freeze\(\{.*?\n\}\);\nconst STARTER_CHARACTER_IDS_36"
          block="""const STARTER_CHARACTER_PRESETS_36=Object.freeze({
  'starter-highschool-male':{
    label:'starterHighschoolMale36',
    ja:{summary:'高校生年代の男子。学園・日常シーン向けの汎用キャラクター。完成絵では服を着た人物として描く。',hair:'短い黒髪',eyes:'茶色い目',outfit:'白い長袖シャツ、紺のブレザー、グレーのスラックス、黒い靴の学校制服',features:'清潔感のある一般的な制服姿'},
    en:{summary:'A high-school-age boy for general school and everyday scenes. Render him as a clothed character in finished art.',hair:'short black hair',eyes:'brown eyes',outfit:'school uniform: white long-sleeve shirt, navy blazer, gray trousers, black shoes',features:'clean, ordinary school-uniform appearance'}
  },
  'starter-highschool-female':{
    label:'starterHighschoolFemale36',
    ja:{summary:'高校生年代の女子。学園・日常シーン向けの汎用キャラクター。完成絵では服を着た人物として描く。',hair:'肩までの黒髪',eyes:'茶色い目',outfit:'白い長袖ブラウス、紺のブレザー、膝丈のプリーツスカート、黒いハイソックス、ローファーの学校制服',features:'清潔感のある一般的な制服姿'},
    en:{summary:'A high-school-age girl for general school and everyday scenes. Render her as a clothed character in finished art.',hair:'shoulder-length black hair',eyes:'brown eyes',outfit:'school uniform: white long-sleeve blouse, navy blazer, knee-length pleated skirt, black knee socks, loafers',features:'clean, ordinary school-uniform appearance'}
  },
  'starter-adult-male':{
    label:'starterAdultMale36',
    ja:{summary:'成人男性。日常・仕事シーン向けの汎用キャラクター。完成絵では服を着た人物として描く。',hair:'短い黒髪',eyes:'茶色い目',outfit:'無地の長袖シャツ、チノパン、スニーカーのシンプルな日常着',features:'落ち着いた一般的な成人男性'},
    en:{summary:'An adult man for general everyday or work scenes. Render him as a clothed character in finished art.',hair:'short black hair',eyes:'brown eyes',outfit:'simple everyday outfit: plain long-sleeve shirt, chino trousers, sneakers',features:'ordinary understated adult appearance'}
  },
  'starter-adult-female':{
    label:'starterAdultFemale36',
    ja:{summary:'成人女性。日常・仕事シーン向けの汎用キャラクター。完成絵では服を着た人物として描く。',hair:'肩までの黒髪',eyes:'茶色い目',outfit:'長袖ブラウス、アンクル丈パンツ、フラットシューズのシンプルな日常着',features:'落ち着いた一般的な成人女性'},
    en:{summary:'An adult woman for general everyday or work scenes. Render her as a clothed character in finished art.',hair:'shoulder-length black hair',eyes:'brown eyes',outfit:'simple everyday outfit: long-sleeve blouse, ankle-length trousers, flat shoes',features:'ordinary understated adult appearance'}
  },
  'starter-mob-male':{
    label:'starterMobMale36',
    ja:{summary:'背景・群衆・通行人向けの男性モブ。主役より目立たない全身着衣の汎用外見。',hair:'短い黒髪',eyes:'茶色い目',outfit:'グレーのパーカー、黒いロングパンツ、スニーカーの目立たない日常着',features:'目立つ固有特徴なし'},
    en:{summary:'A fully clothed male background/crowd/passersby character with deliberately low visual distinctiveness.',hair:'short black hair',eyes:'brown eyes',outfit:'low-key everyday outfit: gray hoodie, black full-length trousers, sneakers',features:'no prominent identifying feature'}
  },
  'starter-mob-female':{
    label:'starterMobFemale36',
    ja:{summary:'背景・群衆・通行人向けの女性モブ。主役より目立たない全身着衣の汎用外見。',hair:'肩までの黒髪',eyes:'茶色い目',outfit:'カーディガン、クルーネックのトップス、ロングパンツ、スニーカーの目立たない日常着',features:'目立つ固有特徴なし'},
    en:{summary:'A fully clothed female background/crowd/passersby character with deliberately low visual distinctiveness.',hair:'shoulder-length black hair',eyes:'brown eyes',outfit:'low-key everyday outfit: cardigan, crew-neck top, full-length trousers, sneakers',features:'no prominent identifying feature'}
  }
});
const STARTER_CHARACTER_IDS_36"""
          s2,n=re.subn(pattern,block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'failed starter preset replacement: {n}')
          s2=s2.replace("appearance:{summary:localized.summary,hair:'',eyes:'',outfit:localized.outfit,features:localized.features||''}","appearance:{summary:localized.summary,hair:localized.hair||'',eyes:localized.eyes||'',outfit:localized.outfit,features:localized.features||''}",1)
          if s2==s: raise SystemExit('starter file unchanged')
          write(p,s2)

          p='web/runtime/identity/character-guidance.js'
          old="const lines=['','CHARACTER IDENTITY GUIDANCE:'];for(const ch of used){"
          new="const lines=['','CHARACTER IDENTITY GUIDANCE:','- Planning stick figures are pose/placement guides only and do not indicate clothing state. Use each character\\'s explicit outfit guidance. If an outfit is unspecified, use ordinary scene-appropriate clothing rather than interpreting the stick figure as an unclothed body.'];for(const ch of used){"
          replace_once(p,old,new)

          p='web/runtime/handoff/render-brief.js'
          replace_once(p,"doesNotControl:['character-appearance','render-style','visible-text']","doesNotControl:['character-appearance','clothing-state','render-style','visible-text']")
          replace_once(p,"doNotInherit:['stick-figure-appearance','authoring-labels'","doNotInherit:['stick-figure-appearance','stick-figure-clothing-state','authoring-labels'")
          replace_once(p,"'- CLEAN Manga Blueprint PNG = SPATIAL LAYOUT reference. Preserve exact panel geometry/proportions and strong relative spatial relationships. Do NOT copy stick-figure appearance.',","'- CLEAN Manga Blueprint PNG = SPATIAL LAYOUT reference. Preserve exact panel geometry/proportions and strong relative spatial relationships. Do NOT copy stick-figure appearance.',\n    '- Stick figures are abstract pose/placement guides only. Do not interpret a stick figure as an unclothed body or as clothing guidance.',\n    '- Render each character using the explicit outfit in CHARACTER IDENTITY GUIDANCE. If outfit is unspecified, use ordinary scene-appropriate clothing; never infer nudity from the planning stick figure.',")
          replace_once(p,"stickFigureJointConstraint:'guidance-only'","stickFigureJointConstraint:'guidance-only',\n      stickFigureDoesNotImplyNudity:true,\n      explicitCharacterOutfitPriority:true,\n      unspecifiedOutfitFallback:'ordinary-scene-appropriate-clothing'")

          p='scripts/validate-template-character-cast.mjs'
          replace_once(p,"  '@media(max-width:760px)'\n])requireText(runtime,token,'template cast integration');","  '@media(max-width:760px)',\n  \"hair:localized.hair||''\",\n  \"eyes:localized.eyes||''\",\n  '白い長袖シャツ、紺のブレザー',\n  'long-sleeve blouse, ankle-length trousers',\n  'gray hoodie, black full-length trousers'\n])requireText(runtime,token,'template cast integration');")

          p='scripts/validate-render-brief.mjs'
          replace_once(p,"  \"stickFigureJointConstraint:'guidance-only'\"","  \"stickFigureJointConstraint:'guidance-only'\",\n  \"stickFigureDoesNotImplyNudity:true\",\n  \"explicitCharacterOutfitPriority:true\",\n  'Do not interpret a stick figure as an unclothed body',\n  'never infer nudity from the planning stick figure'")

          p='docs/PROMPT_HANDOFF.md'
          replace_once(p,"The planning stick figure does **not** define finished appearance or pixel-exact anatomy.","The planning stick figure does **not** define finished appearance, clothing state, or pixel-exact anatomy. A stick figure is an abstract pose/placement guide and must never be interpreted as an unclothed body. Finished clothing comes from Character Sheet / appearance guidance. If no outfit is specified, downstream generation uses ordinary scene-appropriate clothing instead of inferring nudity from the planning figure.")

          p='docs/PRODUCT.md'
          replace_once(p,"New works begin with six editable starter base characters in `description` mode: high-school boy/girl, adult man/woman, and male/female background characters. These are intentionally generic starting constraints, not finished identities. Existing/imported works are not silently populated; the Character tab may explicitly add any missing starter.\n\nStick figures are pose/placement references. They communicate body relation, pose, approximate scale, and direction, not finished character appearance.","New works begin with six editable starter base characters in `description` mode: high-school boy/girl, adult man/woman, and male/female background characters. These remain generic starting identities, but each starter now carries concrete hair, eye, and fully specified everyday/school clothing so downstream rendering never has to infer clothing from the planning figure. Existing/imported works are not silently populated; the Character tab may explicitly add any missing starter.\n\nStick figures are pose/placement references. They communicate body relation, pose, approximate scale, and direction, not finished character appearance or clothing state. Generation must use explicit character outfit guidance when present; an unspecified outfit falls back to ordinary scene-appropriate clothing rather than treating a stick figure as unclothed.")

          p='docs/USER-GUIDE.md'
          replace_once(p,"新規作品には、編集可能な汎用ベースとして **高校生男子 / 高校生女子 / 成人男性 / 成人女性 / モブ男性 / モブ女性** の6人が最初から入ります。全員「文章で指定」方式のたたき台で、名前・容姿・服装は自由に変更できます。既存作品や読み込んだ作品へは勝手に追加せず、**キャラ → かんたん追加** から必要なものだけ追加できます。\n\nThe stick figure is a **pose and placement reference**, not the character's finished appearance.","新規作品には、編集可能な汎用ベースとして **高校生男子 / 高校生女子 / 成人男性 / 成人女性 / モブ男性 / モブ女性** の6人が最初から入ります。全員「文章で指定」方式で、髪・目・服装まで初期値があります。高校生は長袖シャツ/ブラウス＋ブレザー等の学校制服、成人・モブは長袖トップス＋ロングパンツ等の通常着を明示しています。名前・容姿・服装は自由に変更できます。既存作品や読み込んだ作品へは勝手に追加せず、**キャラ → かんたん追加** から必要なものだけ追加できます。\n\nThe stick figure is a **pose and placement reference**, not the character's finished appearance or clothing state. AI handoff explicitly tells the renderer not to interpret stick figures as unclothed bodies; explicit outfit guidance has priority.")

          p='web/guide.html'
          replace_once(p,"<div class=\"callout\">キャンバスの棒人間は<strong>見た目ではなくポーズ・位置・大きさの設計図</strong>です。</div>","<div class=\"callout\">キャンバスの棒人間は<strong>見た目や服装ではなくポーズ・位置・大きさの設計図</strong>です。棒人間を裸として解釈せず、キャラクターに設定した服装を完成絵へ使います。</div>")
          replace_once(p,"<div class=\"callout\"><strong>新規作品には6人のスターターがあります。</strong> 高校生男子 / 高校生女子 / 成人男性 / 成人女性 / モブ男性 / モブ女性。すべて編集可能な汎用のたたき台です。既存作品には自動追加せず、キャラタブの「かんたん追加」から必要なものを足せます。</div>","<div class=\"callout\"><strong>新規作品には6人のスターターがあります。</strong> 高校生男子 / 高校生女子 / 成人男性 / 成人女性 / モブ男性 / モブ女性。髪・目に加えて、学校制服や長袖トップス＋ロングパンツ等の服装まで初期指定した編集可能な汎用ベースです。既存作品には自動追加せず、キャラタブの「かんたん追加」から必要なものを足せます。</div>")

          # Version 0.17.1
          replace_once('package.json','\"version\": \"0.17.0\"','\"version\": \"0.17.1\"')
          p='package-lock.json'; s=read(p); old='\"version\": \"0.17.0\"';
          if s.count(old)<2: raise SystemExit('package-lock expected two root version entries')
          write(p,s.replace(old,'\"version\": \"0.17.1\"',2))
          replace_once('web/build-info.json','\"appVersion\": \"0.17.0\"','\"appVersion\": \"0.17.1\"')
          replace_once('web/src/main.ts',"appVersion:'0.17.0'","appVersion:'0.17.1'")
          replace_once('web/runtime/handoff/producer-provenance.js',"appVersion:'0.17.0'","appVersion:'0.17.1'")
          replace_once('README.md','Current prototype: 0.17.0','Current prototype: 0.17.1')
          replace_once('docs/ROADMAP.md','Shipped through Prototype 0.17.0','Shipped through Prototype 0.17.1')

          Path('docs/PROTOTYPE-0.17.1.md').write_text('''# Prototype 0.17.1 — explicit starter clothing and stick-figure handoff\n\nPrototype 0.17.1 makes clothing intent explicit so a planning stick figure is not mistaken for an unclothed finished character.\n\n## Changes\n\n- all six starter characters now include concrete hair, eye, and outfit defaults;\n- school-age starters use explicit school uniforms and adult/background starters use ordinary full everyday clothing;\n- AI handoff states that stick figures control pose/placement only and do not define clothing state;\n- explicit character outfit guidance has priority, with ordinary scene-appropriate clothing as the fallback when no outfit is authored;\n- render-brief cross-model hints expose the same clothing interpretation contract;\n- regression validation checks starter appearance completeness and the no-nudity-inference handoff wording.\n\n## Documentation\n\nCurrent workflow is synchronized in `docs/USER-GUIDE.md`, `docs/PRODUCT.md`, `docs/PROMPT_HANDOFF.md`, and the public `/guide.html`.\n''')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify focused contracts
        run: |
          npm run typecheck
          npm run build
          node scripts/validate-template-character-cast.mjs
          node scripts/validate-render-brief.mjs
          node scripts/validate-documentation-sync.mjs
          node scripts/validate-version-sync.mjs
      - name: Commit generated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/runtime/integration/template-character-cast.js web/runtime/identity/character-guidance.js web/runtime/handoff/render-brief.js scripts/validate-template-character-cast.mjs scripts/validate-render-brief.mjs docs/PROMPT_HANDOFF.md docs/PRODUCT.md docs/USER-GUIDE.md web/guide.html package.json package-lock.json web/build-info.json web/src/main.ts web/runtime/handoff/producer-provenance.js README.md docs/ROADMAP.md docs/PROTOTYPE-0.17.1.md
          git commit -m 'Make starter clothing explicit in AI handoff'
          git push origin HEAD:fix/starter-character-clothing-contract
