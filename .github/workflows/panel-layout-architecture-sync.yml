name: Panel layout architecture documentation sync

on:
  push:
    branches: [feat/panel-layout-grammar]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/panel-layout-grammar
          fetch-depth: 0
      - name: Synchronize runtime ownership docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')

          roadmap=read('docs/ROADMAP.md')
          roadmap=re.sub(
              r'## Shipped\n\n(- Prototype 0\.18\.0:[^\n]+\n) through Prototype 0\.18\.0',
              r'## Shipped through Prototype 0.18.0\n\n\1',
              roadmap,
              count=1
          )
          if '## Shipped through Prototype 0.18.0' not in roadmap:
              raise SystemExit('failed to repair roadmap shipped heading')
          write('docs/ROADMAP.md',roadmap)

          architecture=read('docs/ARCHITECTURE.md')
          section='''\n\n## Panel layout grammar runtime — Prototype 0.18.0\n\n`web/runtime/templates/panel-layout-grammar.js` is the semantic owner for reusable manga page-layout families introduced after the base quadrilateral geometry layer. It loads after `templates/discovery-presentation.js` and before cast/apply integration.\n\nResponsibilities:\n\n- define tight shared-seam layout geometry (`duel2`, `opposed3`, `zigzag4`) and asymmetric rectangular grammar (`stair4`, `build4`, `detail5`);\n- keep legacy `diagonal3` / `diagonal4` IDs compatible while resolving them through corrected shared-seam geometry;\n- assign shipped Story Templates to layout families by visual purpose;\n- add layout-family search tags and keep new diagonal families visible to presentation discovery;\n- register the small set of Story Templates whose purpose is specifically to demonstrate missing layout-grammar coverage.\n\nIt does **not** own base panel-shape validation, user-authored quadrilateral editing, story/cast semantics, or final template application. Those remain with `authoring/panel-geometry.js`, Story Template semantic modules, and `templates/presentation-contract.js`.\n'''
          if '## Panel layout grammar runtime — Prototype 0.18.0' not in architecture: architecture+=section
          write('docs/ARCHITECTURE.md',architecture)

          runtime=read('web/runtime/README.md')
          section='''\n\n### `templates/panel-layout-grammar.js`\n\nOwns the Prototype 0.18.0 page-layout grammar layered on top of quadrilateral panel geometry: shared diagonal seams with compact gutters, asymmetric visual-weight families, Story Template layout-family assignment, compatibility handling for `diagonal3` / `diagonal4`, and diagonal discovery integration. Base polygon validation/editing remains in `authoring/panel-geometry.js`; apply-time shape transfer remains in `templates/presentation-contract.js`.\n'''
          if '### `templates/panel-layout-grammar.js`' not in runtime: runtime+=section
          write('web/runtime/README.md',runtime)

          docs=read('docs/README.md')
          anchor='- `TASKS-RESEARCH-YYYY-MM-DD.md`\n'
          addition='- `PANEL-LAYOUT-GRAMMAR-YYYY-MM-DD.md`\n'
          if addition not in docs:
              if anchor not in docs: raise SystemExit('docs research family anchor missing')
              docs=docs.replace(anchor,anchor+addition,1)
          write('docs/README.md',docs)
          PY

          rm .github/workflows/panel-layout-architecture-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document panel layout runtime ownership"
          git push origin HEAD:feat/panel-layout-grammar
