name: Validate prototype

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/app-1.js
          node --check web/app-2.js
          node --check web/app-3.js
          node --check web/app-4.js
          node --check web/app-5.js
          node --check web/app-6.js
          node --check web/app-7.js
          node --check web/app-8.js
          node --check web/app-9.js
          node --check web/app-10.js
          node --check web/app-11.js
          node --check web/app-12.js
          node --check web/app-13.js
          node --check web/app-14.js
          node --check web/app-15.js
          node --check web/app-16.js
          node --check web/app-17.js
          node --check web/app-18.js
          node --check web/app-19.js
          node --check web/app-20.js
          node --check web/app-21.js
          node --check web/app-22.js
          node --check web/app-23.js
          node --check web/app-24.js

      - name: Validate repository contract
        run: node scripts/validate.mjs

      - name: Validate Panel Peek mobile contract
        run: node scripts/validate-panel-peek.mjs

      - name: Validate Template Studio contract
        run: node scripts/validate-template-studio.mjs

      - name: Validate writing-direction contract
        run: node scripts/validate-writing-direction.mjs

      - name: Validate reading-order synchronization
        run: node scripts/validate-reading-order.mjs

      - name: Validate lettering / reading integration
        run: node scripts/validate-lettering-reading-integration.mjs

      - name: Validate art direction / spatial semantics
        run: node scripts/validate-art-direction-spatial.mjs

      - name: Validate cross-model handoff hardening
        run: node scripts/validate-cross-model-handoff.mjs

      - name: Validate template camera / dialogue quality
        run: node scripts/validate-template-quality.mjs

      - name: Validate scene contract / quick status
        run: node scripts/validate-scene-contract.mjs

      - name: Validate desktop responsive layout
        run: node scripts/validate-desktop-layout.mjs
