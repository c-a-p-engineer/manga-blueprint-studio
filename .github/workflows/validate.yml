name: Validate prototype

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/app-1.js
          node --check web/app-2.js
          node --check web/app-3.js
          node --check web/app-4.js
          node --check web/app-5.js
          node --check web/app-6.js
          node --check web/app-7.js
          node --check web/app-8.js
          node --check web/app-9.js
          node --check web/app-10.js
          node --check web/app-11.js
          node --check web/app-12.js

      - name: Validate repository contract
        run: node scripts/validate.mjs
