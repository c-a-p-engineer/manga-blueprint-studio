name: Validate prototype

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check scripts/runtime-paths.mjs
          node --check scripts/validate-runtime-layout.mjs
          node --check scripts/validate-render-brief.mjs
          find web/runtime -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate semantic runtime layout
        run: node scripts/validate-runtime-layout.mjs

      - name: Validate repository contract
        run: node scripts/validate.mjs

      - name: Validate Panel Peek mobile contract
        run: node scripts/validate-panel-peek.mjs

      - name: Validate Template Studio contract
        run: node scripts/validate-template-studio.mjs

      - name: Validate writing-direction contract
        run: node scripts/validate-writing-direction.mjs

      - name: Validate reading-order synchronization
        run: node scripts/validate-reading-order.mjs

      - name: Validate lettering / reading integration
        run: node scripts/validate-lettering-reading-integration.mjs

      - name: Validate art direction / spatial semantics
        run: node scripts/validate-art-direction-spatial.mjs

      - name: Validate cross-model handoff hardening
        run: node scripts/validate-cross-model-handoff.mjs

      - name: Validate template camera / dialogue quality
        run: node scripts/validate-template-quality.mjs

      - name: Validate scene contract / quick status
        run: node scripts/validate-scene-contract.mjs

      - name: Validate desktop responsive layout
        run: node scripts/validate-desktop-layout.mjs

      - name: Validate authoring clarity
        run: node scripts/validate-authoring-clarity.mjs

      - name: Validate template cast meaning
        run: node scripts/validate-template-cast-meaning.mjs

      - name: Validate two-visible templates / quick filters
        run: node scripts/validate-two-visible-filters.mjs

      - name: Validate per-panel cast visibility
        run: node scripts/validate-panel-cast-flow.mjs

      - name: Validate generation contract hardening
        run: node scripts/validate-generation-contract.mjs

      - name: Validate current-page render brief
        run: node scripts/validate-render-brief.mjs
