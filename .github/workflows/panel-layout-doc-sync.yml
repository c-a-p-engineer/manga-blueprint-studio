name: Panel layout release documentation sync

on:
  push:
    branches: [feat/panel-layout-grammar]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/panel-layout-grammar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync version and documentation
        run: |
          npm version 0.18.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          import json, re

          VERSION='0.18.0'

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def must_replace(path,old,new):
              text=read(path)
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:100]!r}')
              write(path,text.replace(old,new,1))

          build=json.loads(read('web/build-info.json'))
          build['appVersion']=VERSION
          write('web/build-info.json',json.dumps(build,ensure_ascii=False,indent=2)+'\n')
          must_replace('web/src/main.ts',"appVersion:'0.17.1'",f"appVersion:'{VERSION}'")
          must_replace('web/runtime/handoff/producer-provenance.js',"appVersion:'0.17.1'",f"appVersion:'{VERSION}'")

          readme=read('README.md')
          readme=readme.replace('## Current prototype: 0.17.1',f'## Current prototype: {VERSION}',1)
          readme=re.sub(
              r'Prototype \*\*0\.17\.0\*\* starts the TypeScript \+ Vite cutover.*?existing hierarchy data remains readable in Work Explorer\.\n',
              'Prototype **0.18.0** rebuilds panel-layout grammar for Story Templates: neighboring diagonal panels now share a narrow constant seam instead of opening into large white wedges/crosses, panel sizes use stronger visual-weight contrast, and shipped templates are reorganized onto purpose-specific layout families. New `duel2`, `opposed3`, `zigzag4`, `stair4`, `build4`, and `detail5` layouts are available while legacy `diagonal3` / `diagonal4` remain load-compatible.\n',
              readme,
              count=1,
              flags=re.S
          )
          marker='- rectangle and convex-quadrilateral panel boundaries with direct four-corner editing and irregular layout presets;\n'
          addition='- manga-aware panel-layout grammar with tight shared diagonal seams, asymmetric staggered layouts, buildup/detail-to-hero layouts, and automated whitespace/area-contrast checks;\n'
          if addition not in readme:
              if marker not in readme: raise SystemExit('README panel geometry anchor missing')
              readme=readme.replace(marker,marker+addition,1)
          old='`斜め3コマ` and `斜め4コマ 2×2` start with irregular panel boundaries.'
          new='Dynamic Story Templates use tight shared-seam layouts such as `対向3コマ（斜め）` and `ジグザグ4コマ`; manual layout also includes `段違い4コマ`, `溜め→大ゴマ 4コマ`, `ディテール→大ゴマ 5コマ`, and `対比2コマ（斜め）`. Legacy `斜め3コマ` / `斜め4コマ 2×2` open with the corrected tight-seam geometry.'
          if old in readme: readme=readme.replace(old,new,1)
          story_anchor='Story Template Studio provides recognizable editable beat patterns. Selection is card-first; the old duplicate Story Template dropdown is hidden.'
          story_extra=' Story Templates now choose a panel-layout family by visual purpose: dynamic pressure/impact uses shared diagonal seams, dialogue/reaction uses staggered rectangles, and emotional buildup/reveal uses deliberate small-to-large area contrast.'
          if story_anchor in readme and story_extra.strip() not in readme:
              readme=readme.replace(story_anchor,story_anchor+story_extra,1)
          write('README.md',readme)

          product=read('docs/PRODUCT.md')
          section='''\n\n## Panel-layout grammar — Prototype 0.18.0\n\nStory Template panel layout is selected by visual purpose, not by decoration. The current grammar provides `duel2`, `opposed3`, `zigzag4`, `stair4`, `build4`, and `detail5`. Dynamic neighboring panels use a shared parallel diagonal seam with a narrow constant gutter instead of independently skewed rectangles that create large white wedges or a central cross.\n\nThe product contract is:\n\n- Japanese RTL readability is more important than decorative irregularity.\n- Horizontal progression inside a tier uses a tighter gutter than the inter-tier drop.\n- Hero/payoff layouts must have meaningful panel-area contrast rather than equal boxes.\n- Quiet/intimate templates may deliberately keep stable rectangular layouts.\n- Legacy `diagonal3` / `diagonal4` IDs stay load-compatible and resolve to the corrected shared-seam geometry.\n- Template search keeps the existing `斜めコマ` discovery path for the new diagonal families.\n'''
          if '## Panel-layout grammar — Prototype 0.18.0' not in product: product+=section
          write('docs/PRODUCT.md',product)

          guide=read('docs/USER-GUIDE.md')
          section='''\n\n## コマ割り文法：余白を増やさず、大小で見せる\n\nPrototype 0.18.0 では、斜めコマを「各コマを別々に傾ける」方式から、隣り合うコマが**細い共有斜線**を持つ方式へ変更しました。これにより斜め枠の間に大きな白いV字・十字の余白ができにくくなります。\n\nページ設定のコマ割りでは次を使えます。\n\n- **対比2コマ（斜め）**: Before/After、対比、対峙\n- **対向3コマ（斜め）**: 上2コマで圧を作り、下の大ゴマで決める\n- **ジグザグ4コマ**: 上下で斜線を反転し、高速な攻防を送る\n- **段違い4コマ**: 均等2×2ではなく左右の幅を変え、会話・リアクションにメリハリを作る\n- **溜め→大ゴマ 4コマ**: 状況→細部→反応→大きな決め\n- **ディテール→大ゴマ 5コマ**: 小さな観察を積んでから大きく発見を見せる\n\nStory Template もこの文法へ整理されています。たとえば `怒り爆発` / `一撃必殺` は対向3コマ、`反撃` / `連続攻防` はジグザグ4コマ、日常会話や軽いリアクションは段違い4コマ、告白・覚醒・キャラ登場は溜め→大ゴマを基準にします。静かな余韻や親密な場面では、斜め枠を乱用せず安定した長方形レイアウトを残します。\n\n旧 **斜め3コマ / 斜め4コマ 2×2** を含む既存データは読み込めます。旧IDも新しい細い共有斜線の形で表示されます。\n'''
          if '## コマ割り文法：余白を増やさず、大小で見せる' not in guide: guide+=section
          write('docs/USER-GUIDE.md',guide)

          public=read('web/guide.html')
          toc='<a href="#panel-shape">斜めコマ・四隅編集</a>'
          if 'href="#panel-layout-grammar"' not in public:
              if toc not in public: raise SystemExit('public guide TOC anchor missing')
              public=public.replace(toc,toc+'\n      <a href="#panel-layout-grammar">コマ割り文法</a>',1)
          section='''\n      <section id="panel-layout-grammar">\n        <h2>コマ割り文法：斜めでも余白を広げない</h2>\n        <p>Prototype 0.18.0 では、隣り合う斜めコマを別々に傾けず、<strong>細い共有斜線</strong>で分けます。大きな白いV字や中央の十字余白を作りにくくし、絵そのものへ視線を戻します。</p>\n        <div class="card-grid">\n          <article class="card"><h3>対向3コマ（斜め）</h3><p>上段2コマを共有斜線でつなぎ、下の大ゴマへ落とします。怒り・決定打・発見向け。</p></article>\n          <article class="card"><h3>ジグザグ4コマ</h3><p>上下で斜線を反転し、高速な攻防や反撃を右→左→下へ送ります。</p></article>\n          <article class="card"><h3>段違い4コマ</h3><p>左右の幅を上下で入れ替え、均等2×2より会話・リアクションへ大小をつけます。</p></article>\n          <article class="card"><h3>溜め / ディテール → 大ゴマ</h3><p>小さい情報を積み、決断・発見・見せ場へ大きな面積を渡します。</p></article>\n        </div>\n        <div class="callout"><strong>斜め枠は演出です。</strong> 静かな余韻や親密な場面では、読みやすい長方形をあえて使うテンプレートも残しています。</div>\n      </section>\n'''
          if 'id="panel-layout-grammar"' not in public:
              anchor='      <section id="tabs">'
              if anchor not in public: raise SystemExit('public guide insertion anchor missing')
              public=public.replace(anchor,section+'\n'+anchor,1)
          write('web/guide.html',public)

          roadmap=read('docs/ROADMAP.md')
          roadmap=roadmap.replace('Shipped through Prototype 0.17.1',f'Shipped through Prototype {VERSION}',1)
          shipped='- Prototype 0.18.0: manga-aware panel-layout grammar with tight shared diagonal seams, stronger panel-area contrast, Story Template remapping, and three new layout-coverage templates.\n'
          if shipped not in roadmap:
              heading='## Shipped'
              if heading in roadmap: roadmap=roadmap.replace(heading,heading+'\n\n'+shipped,1)
              else: roadmap+='\n\n'+shipped
          write('docs/ROADMAP.md',roadmap)

          release=f'''# Prototype {VERSION}\n\nPrototype {VERSION} refreshes Story Template panel composition around manga-specific page rhythm rather than decorative skew.\n\n## Shipped\n\n- Added `duel2`, `opposed3`, `zigzag4`, `stair4`, `build4`, and `detail5` layout families.\n- Replaced legacy wide-wedge diagonal geometry with narrow shared parallel seams; old `diagonal3` / `diagonal4` IDs remain compatible.\n- Reorganized existing Story Templates by visual purpose: pressure/impact, dialogue/reaction, buildup/payoff, or intentionally stable layouts.\n- Added `変化の前後 2コマ`, `転換点 4コマ`, and `手元→発見 5コマ`.\n- Added deterministic checks for panel count, canvas bounds, inner whitespace, hero-panel area contrast, template mapping, and diagonal discovery integration.\n- Added research rationale in `docs/PANEL-LAYOUT-GRAMMAR-2026-09-12.md`.\n\n## Documentation\n\n- Canonical behavior: `docs/PRODUCT.md`\n- User workflow: `docs/USER-GUIDE.md`\n- Public guide: `/guide.html`\n\nProject format remains `manga-blueprint/0.2`; this release does not migrate serialized project schema.\n'''
          write(f'docs/PROTOTYPE-{VERSION}.md',release)
          PY

          rm .github/workflows/panel-layout-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Prototype 0.18.0 panel layout docs and version"
          git push origin HEAD:feat/panel-layout-grammar
