name: One-shot P1 documentation sync

on:
  push:
    branches: ['work/story-template-p1-catalog']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/story-template-p1-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize P1 release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Runtime/build version: cache-bust the newly shipped Story Template catalog.
          replace_once('web/build-info.json', '"appVersion": "0.16.1"', '"appVersion": "0.16.2"')
          replace_once('web/app.js', "appVersion:'0.16.1'", "appVersion:'0.16.2'")
          producer = read('web/runtime/handoff/producer-provenance.js')
          producer = producer.replace('// Prototype 0.16.1:', '// Prototype 0.16.2:', 1)
          if "appVersion:'0.16.1'" not in producer:
              raise SystemExit('producer provenance version anchor missing')
          producer = producer.replace("appVersion:'0.16.1'", "appVersion:'0.16.2'", 1)
          write('web/runtime/handoff/producer-provenance.js', producer)

          # README: current release headline + discoverability summary.
          replace_once('README.md', '## Current prototype: 0.16.1', '## Current prototype: 0.16.2')
          replace_once(
              'README.md',
              'Prototype **0.16.1** is a focused Advanced Panel Geometry polish release. When a quadrilateral panel is reshaped, the annotated panel-number badge now follows the authored top-right corner inward instead of staying attached to the panel bounding box. Prototype 0.16.0 remains the foundation for editable convex quadrilaterals, diagonal/trapezoid presets, irregular layout templates, polygon-aware export, and the two-row mobile header.',
              'Prototype **0.16.2** expands Story Template discovery into an演出カタログ: cards can be filtered by diagonal panels, frame type, focus/speed/impact/tension/silence effects, breakout, and with/without presentation effects. Six additional presentation-focused templates make those filters immediately usable, while Prototype 0.16.1 remains the panel-number geometry follow-up and 0.16.0 remains the quadrilateral foundation.'
          )
          replace_once(
              'README.md',
              '- Story Template Studio and bounded Smart Manga proposals;',
              '- Story Template Studio with card-first selection, compound quick filters for cast/story/presentation, presentation chips, diagonal thumbnails, and bounded Smart Manga proposals;'
          )
          replace_once(
              'README.md',
              '3. In **ページ設定**, choose manuscript size, reading direction, art direction, and a layout/Story Template/Smart Manga as needed. `斜め3コマ` and `斜め4コマ 2×2` start with irregular panel boundaries.',
              '3. In **ページ設定**, choose manuscript size, reading direction, art direction, and a layout/Story Template/Smart Manga as needed. Story Template cards can be narrowed by 2人表示・恋愛などの条件と、斜めコマ・衝撃枠・集中線などの演出条件を組み合わせて探せます。`斜め3コマ` and `斜め4コマ 2×2` start with irregular panel boundaries.'
          )
          replace_once(
              'README.md',
              'Story Template Studio provides recognizable editable beat patterns. Smart Manga provides bounded alternative proposals from a purpose. Both remain non-mutating until explicit apply.',
              'Story Template Studio provides recognizable editable beat patterns. Selection is card-first; the old duplicate Story Template dropdown is hidden. Quick filters can be combined across cast/relationship/dialogue/art and presentation features such as diagonal panels, impact/borderless/inset frames, focus/speed/impact/tension/silence effects, breakout, and 演出あり / 演出なし. Cards expose presentation chips so a sample can be found and applied without opening every template. Smart Manga remains a separate bounded proposal system. Both remain non-mutating until explicit apply.'
          )
          replace_once('README.md', '[`docs/PROTOTYPE-0.16.1.md`](docs/PROTOTYPE-0.16.1.md) — current release note.', '[`docs/PROTOTYPE-0.16.2.md`](docs/PROTOTYPE-0.16.2.md) — current release note.')
          replace_once('README.md', 'Current application baseline: **Prototype 0.16.1**.', 'Current application baseline: **Prototype 0.16.2**.')

          # Product contract: make discovery semantics explicit.
          replace_once(
              'docs/PRODUCT.md',
              '''Templates may be discovered by:\n\n- category;\n- free-text search over title/description/use case/tags/actions;\n- visual cards and layout thumbnails;\n- panel count;\n- beat-flow preview;\n- cast expectations/filters where available.''',
              '''Templates may be discovered by:\n\n- category;\n- free-text search over title/description/use case/tags/actions **and presentation terms** such as `衝撃枠`, `集中線`, or `枠無し`;\n- visual cards and shape-aware layout thumbnails;\n- presentation chips that summarize diagonal geometry, special frame types, line effects, and breakout;\n- panel count;\n- beat-flow preview;\n- cast/relationship/dialogue/art quick filters where available;\n- presentation quick filters for `演出あり / 演出なし`, diagonal panels, `impact / borderless / inset` frames, `focus / speed / impact / tension / silence` line effects, and breakout.\n\nQuick-filter groups are conjunctive across groups, so users can ask for combinations such as **2人表示 + 集中線** or **斜めコマ + 衝撃枠**. Within a single group, choosing another value replaces the prior value. The shipped catalog includes multiple concrete samples for the presentation filters so filters are useful as an effect sampler rather than empty taxonomy.'''
          )
          replace_once(
              'docs/PRODUCT.md',
              '- browsing/filtering/searching/previewing does not mutate the current page;',
              '- browsing/filtering/searching/previewing does not mutate the current page;\n- template selection is card-first; the duplicate legacy Story Template dropdown is not presented as a second selection surface;'
          )

          # User guide: explain the user workflow rather than implementation details.
          replace_once(
              'docs/USER-GUIDE.md',
              'Use it for recognizable story/beat patterns such as confession, reaction, battle opening, counterattack, gag failure, or character introduction. Browsing/searching does not mutate the current page; only explicit apply changes it.',
              '''Use it for recognizable story/beat patterns such as confession, reaction, battle opening, counterattack, gag failure, or character introduction. Browsing/searching does not mutate the current page; only explicit apply changes it.\n\nテンプレートは**カードを選ぶだけ**で選択されます。以前の重複した「ストーリーテンプレート」ドロップダウンは表示しません。カードには、そのテンプレートで使う主な演出がチップで表示されます。\n\nクイック絞り込みでは、1人表示 / 2人表示 / 恋愛 / バトルなどに加えて、次の演出からサンプルを探せます。\n\n- **演出あり / 演出なし** — 演出を使った例と素の構成を比較;\n- **斜めコマ**;\n- **衝撃枠 / 枠無し / 小窓**;\n- **集中線 / スピード線 / 衝撃線 / 緊張線 / 無音・間**;\n- **ブチ抜き**.\n\n異なるグループの条件は組み合わせられるため、たとえば **2人表示 + 集中線**、**斜めコマ + 衝撃枠** のように絞れます。`突進→一撃`、`連続攻防`、`衝撃の発見`、`不穏な接近`、`静かな余韻`、`ツッコミ小窓` など、演出を試すための具体例も用意されています。'''
          )

          # Public guide mirrors the Markdown guide semantically.
          replace_once(
              'web/guide.html',
              '<article><h3>ストーリーテンプレート / Story Template</h3><p>「告白」「反撃」「キャラ登場」など、意味の分かる定番の展開から始めたいときに使います。閲覧だけではページを変更しません。</p></article>',
              '<article><h3>ストーリーテンプレート / Story Template</h3><p>「告白」「反撃」「キャラ登場」など、意味の分かる定番の展開から始めたいときに使います。カードを選ぶとそのテンプレートが選択され、閲覧・検索・絞り込みだけではページを変更しません。</p><p>カードには使用する主な演出がチップで表示されます。重複していたストーリーテンプレートの選択ドロップダウンは表示しません。</p></article>'
          )
          replace_once(
              'web/guide.html',
              '<p><strong>Scene Template / シーンテンプレートという別機能はありません。</strong> 正式名称は Story Template / ストーリーテンプレートです。</p>',
              '<div class="callout"><strong>演出からサンプルを探せます。</strong> 1人表示 / 2人表示 / 恋愛 / バトルなどの条件と、<strong>演出あり / 演出なし、斜めコマ、衝撃枠、枠無し、小窓、集中線、スピード線、衝撃線、緊張線、無音・間、ブチ抜き</strong>を組み合わせて絞り込めます。たとえば「2人表示 + 集中線」「斜めコマ + 衝撃枠」です。`突進→一撃`、`連続攻防`、`衝撃の発見`、`不穏な接近`、`静かな余韻`、`ツッコミ小窓` などをそのまま試せます。</div>\n        <p><strong>Scene Template / シーンテンプレートという別機能はありません。</strong> 正式名称は Story Template / ストーリーテンプレートです。</p>'
          )

          # Roadmap status: this P1 catalog is shipped in 0.16.2; geometry history remains 0.16.0/0.16.1.
          replace_once('docs/ROADMAP.md', '## Shipped through Prototype 0.16.1', '## Shipped through Prototype 0.16.2')
          replace_once(
              'docs/ROADMAP.md',
              '- Story Template Studio with discovery/beat-flow/bounded derivation/custom local templates;',
              '- Story Template Studio with card-first discovery, beat-flow/bounded derivation/custom local templates;\n- **Prototype 0.16.2 Story Template presentation catalog** with compound cast/story/presentation quick filters, presentation chips, shape-aware diagonal thumbnails, 演出あり / 演出なし comparison, and multiple samples for special frames/line effects/breakout;'
          )

          # Documentation CI now protects the newly shipped discovery contract.
          replace_once(
              'scripts/validate-documentation-sync.mjs',
              "for(const phrase of ['P001','作品構成','ページ設定','AI生成ZIP','Story Template','Smart Manga','斜め3コマ','四隅を直接編集']){",
              "for(const phrase of ['P001','作品構成','ページ設定','AI生成ZIP','Story Template','Smart Manga','斜め3コマ','四隅を直接編集','衝撃枠','集中線','演出なし']){"
          )
          replace_once(
              'scripts/validate-documentation-sync.mjs',
              "for(const phrase of ['Manga-first editor shell','Work Structure / 作品構成','Page settings / ページ設定','P001','selected-page scoped','Panel shape','two explicit rows']){",
              "for(const phrase of ['Manga-first editor shell','Work Structure / 作品構成','Page settings / ページ設定','P001','selected-page scoped','Panel shape','two explicit rows','presentation quick filters','2人表示 + 集中線']){"
          )

          release = '''# Prototype 0.16.2 — Story Template presentation catalog\n\nPrototype 0.16.2 turns Story Template discovery into a practical manga-effect sampler while keeping the human-directed, non-mutating browsing contract.\n\n## What changed\n\n- Story Template selection is card-first; the duplicate legacy template dropdown is hidden.\n- Existing cast/story quick filters can be combined with presentation filters.\n- New presentation filters cover **演出あり / 演出なし**, diagonal panels, impact/borderless/inset frames, focus/speed/impact/tension/silence effects, and breakout.\n- Template cards show presentation chips and shaped thumbnails, so users can see the relevant technique before applying it.\n- Free-text search recognizes presentation terms such as `衝撃枠`, `枠無し`, and `集中線`.\n- Six additional samples ship for trying presentation patterns directly: `突進→一撃`, `連続攻防`, `衝撃の発見`, `不穏な接近`, `静かな余韻`, and `ツッコミ小窓`.\n- The two-visible battle sample also demonstrates a combined **2人表示 + 集中線** query, while diagonal battle samples demonstrate **斜めコマ + 衝撃枠**.\n\n## Contracts preserved\n\n- browsing, filtering, searching, and preview remain non-mutating;\n- explicit apply is still required before page content changes;\n- `meta.storyTemplate` remains provenance only;\n- project format remains `manga-blueprint/0.2`;\n- export manifest remains `manga-blueprint-export-manifest/3`;\n- existing rectangle and quadrilateral panel geometry remain compatible.\n\n## Cache freshness\n\nThe application version is bumped to **0.16.2** so versioned runtime-chunk URLs fetch the new Story Template catalog and filter behavior after GitHub Pages deployment.\n\n## Documentation\n\nCurrent behavior is synchronized in `docs/PRODUCT.md`, `docs/USER-GUIDE.md`, `docs/ROADMAP.md`, the repository `README.md`, and the public `/guide.html`.\n'''
          Path('docs/PROTOTYPE-0.16.2.md').write_text(release, encoding='utf-8')

          # Remove this one-shot workflow from the resulting commit to avoid a second run.
          Path('.github/workflows/p1-doc-sync.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document Story Template P1 catalog as 0.16.2'
          git push origin HEAD:work/story-template-p1-catalog
