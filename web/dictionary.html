<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0f172a"/><meta name="description" content="Coreと同じ正規Knowledge Baseから表示する漫画演出辞典。技法の意味、強度、相性、競合、媒体制約、スタイル軸を検索できます。"/><title>漫画演出辞典 — Manga Blueprint Studio</title><link rel="stylesheet" href="./landing.css"/><style>.dictionary-shell{max-width:1200px;margin:auto;padding:44px 22px 90px}.lead{max-width:850px}.search{position:sticky;top:62px;z-index:5;margin:24px 0;padding:15px;border:1px solid #dbe3ef;border-radius:18px;background:#fffffff2;box-shadow:0 12px 32px #0f172a17}.search input{box-sizing:border-box;width:100%;padding:13px 15px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;font-size:16px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.chip[aria-pressed=true]{background:#0f172a;color:#fff}.source,.styles{padding:14px;border-radius:14px;background:#f1f5f9}.status{margin:15px 0;color:#475569}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border:1px solid #dbe3ef;border-radius:18px;padding:18px;background:#fff}.card h2{font-size:20px;margin:0}.alias{font-size:12px;color:#64748b;margin:3px 0 9px}.diagram{height:96px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;position:relative;overflow:hidden;margin:10px 0}.diagram:before{content:'';position:absolute;inset:18px;border:2px solid #94a3b8;border-radius:8px}.diagram.camera:after{content:'●';position:absolute;font-size:42px;left:42%;top:20px}.diagram.panel:after{content:'';position:absolute;width:52%;height:58%;left:24%;top:19%;border:4px solid #334155}.diagram.action:after{content:'➜';position:absolute;font-size:48px;left:35%;top:15px}.diagram.pacing:after{content:'·  ·   ·    ·';position:absolute;font-size:34px;left:18%;top:22px}.diagram.attention:after{content:'◎ ←';position:absolute;font-size:40px;left:34%;top:18px}.diagram.medium:after{content:'↓\A ↓\A ↓';white-space:pre;position:absolute;font-size:22px;left:48%;top:8px}.diagram.composition:after{content:'●';position:absolute;font-size:55px;left:8%;top:14px}.diagram.transition:after{content:'▣ → ▣';position:absolute;font-size:30px;left:25%;top:28px}.diagram.psychology:after{content:'✦';position:absolute;font-size:48px;left:42%;top:17px}.diagram.lettering:after{content:'ドン';position:absolute;font-weight:900;font-size:34px;left:34%;top:25px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.tag{font-size:10px;border-radius:999px;padding:4px 7px;background:#eef2f7}.card dl{display:grid;grid-template-columns:64px 1fr;gap:6px 8px;margin:0;font-size:13px}.card dt{font-weight:800;color:#475569}.card dd{margin:0}.strength{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:11px}.strength span{padding:7px;border-radius:8px;background:#f8fafc;font-size:11px}.machine{margin-top:10px;padding:9px;border-radius:9px;background:#0f172a;color:#e2e8f0;font:11px ui-monospace,monospace;overflow-wrap:anywhere}.style-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.style-grid code{background:#fff;padding:5px 7px;border-radius:7px}.empty{padding:35px;text-align:center;color:#64748b}@media(max-width:800px){.dictionary-shell{padding:28px 14px 65px}.grid{grid-template-columns:1fr}.search{top:54px}.strength{grid-template-columns:1fr}}</style></head><body><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="./"><span class="brand-mark">辞</span><span>漫画演出辞典</span></a><nav class="site-nav"><a href="./techniques.html">技法ガイド</a><a href="./guide.html">操作</a><a class="nav-cta" href="./editor.html">エディタ</a></nav></header><main id="main" class="dictionary-shell"><p class="eyebrow">MANGA DIRECTION DICTIONARY</p><h1>人間とAIが、同じ演出語彙を使う。</h1><p class="hero-lead lead">技法名を知らなくても、効果・日本語・英語IDから探せます。表示内容とSolver/AIが参照する意味は同じCoreから来ています。</p><p class="source"><b>Single Source of Truth:</b> <code>core/manga-knowledge.mjs</code>。公開辞典はコピーを持ちません。</p><section class="styles"><b>正規スタイル軸</b><div id="styleAxes" class="style-grid"></div><small>絵柄は作家名ではなく、線・明暗・色・形・表面・背景という観測可能な軸へ分解します。</small></section><section class="search"><input id="q" type="search" placeholder="例: 迫力 / 怖い / reveal / 寄り / scroll…" autocomplete="off"/><div id="filters" class="filters"></div></section><div id="status" class="status"></div><div id="grid" class="grid"></div></main><script type="module">import{TECHNIQUES,STYLE_AXES}from'../core/manga-knowledge.mjs';const q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),filters=document.querySelector('#filters');const catJa={camera:'カメラ',composition:'構図',panel:'コマ',transition:'編集・遷移',pacing:'時間・テンポ',action:'動き',attention:'視線・情報',psychology:'心理',lettering:'文字・SFX',medium:'媒体固有'};const effectJa={impact:'迫力',emotion:'感情',attention:'誘導',information:'情報',fear:'恐怖',speed:'速さ',hold:'間',reveal:'驚き・開示',surprise:'驚き',clarity:'理解',scale:'巨大さ',space:'空間',depth:'奥行き',direction:'方向',mood:'空気',continuity:'連続',compression:'圧縮',flow:'流れ',presence:'存在感',instability:'不安定',immersion:'没入',isolation:'孤立',detail:'細部',setup:'導入',mystery:'謎'};const entries=Object.values(TECHNIQUES);let active='';for(const cat of [...new Set(entries.map(e=>e.category))]){const b=document.createElement('button');b.className='chip';b.textContent=catJa[cat]||cat;b.dataset.cat=cat;b.setAttribute('aria-pressed','false');filters.append(b)}document.querySelector('#styleAxes').innerHTML=Object.entries(STYLE_AXES).map(([k,v])=>`<code>${k}: ${v.join(' / ')}</code>`).join('');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const human=id=>TECHNIQUES[id]?.ja||id;function card(e){return `<article class="card"><h2>${esc(e.ja)}</h2><div class="alias"><code>${esc(e.id)}</code> · ${esc(e.en)}</div><div class="diagram ${esc(e.category)}" aria-hidden="true"></div><div class="tags"><span class="tag">${esc(catJa[e.category]||e.category)}</span>${e.effects.map(x=>`<span class="tag">${esc(effectJa[x]||x)}</span>`).join('')}</div><dl><dt>意味</dt><dd>${esc(e.summary)}</dd><dt>向く</dt><dd>${esc(e.use)}</dd><dt>注意</dt><dd>${esc(e.caution)}</dd><dt>相性</dt><dd>${e.pairs.length?e.pairs.map(human).map(esc).join(' / '):'—'}</dd><dt>競合</dt><dd>${e.conflicts.length?e.conflicts.map(human).map(esc).join(' / '):'—'}</dd><dt>前提</dt><dd>${esc(e.requires.length?e.requires.join(' / '):'なし')}</dd></dl><div class="strength"><span><b>弱</b><br>${esc(e.strength.weak)}</span><span><b>標準</b><br>${esc(e.strength.standard)}</span><span><b>強</b><br>${esc(e.strength.strong)}</span></div><div class="machine">${esc(JSON.stringify(e.semantic))}</div></article>`}function render(){const query=q.value.trim().toLowerCase().normalize('NFKC');const shown=entries.filter(e=>{const hay=[e.id,e.ja,e.en,e.summary,e.use,e.caution,e.category,...e.effects,...e.pairs,...e.conflicts,...e.requires,JSON.stringify(e.semantic)].join(' ').toLowerCase().normalize('NFKC');return(!active||e.category===active)&&(!query||query.split(/\s+/).every(w=>hay.includes(w)||Object.entries(effectJa).some(([en,ja])=>ja.includes(w)&&e.effects.includes(en))))});status.textContent=`${shown.length} / ${entries.length} 技法${active?' — '+(catJa[active]||active):''}`;grid.innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">該当する技法がありません。</div>'}q.addEventListener('input',render);filters.addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;active=active===b.dataset.cat?'':b.dataset.cat;filters.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cat===active)));render()});render();</script></body></html>
