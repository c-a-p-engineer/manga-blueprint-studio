<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0f172a"/><meta name="description" content="漫画演出を効果・種類・ジャンル・媒体から逆引きできる漫画演出辞典。Coreと同じ正規Knowledge Baseから表示します。"/><title>漫画演出辞典 — Manga Blueprint Studio</title><link rel="stylesheet" href="./landing.css"/><style>.dictionary-shell{max-width:1180px;margin:auto;padding:44px 22px 90px}.dict-lead{max-width:820px}.dict-search{position:sticky;top:62px;z-index:5;margin:24px 0;padding:16px;border:1px solid #dbe3ef;border-radius:18px;background:#fffffff7;box-shadow:0 12px 32px #0f172a17}.dict-search input{box-sizing:border-box;width:100%;padding:13px 15px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;font-size:16px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}.chip[aria-pressed=true]{background:#0f172a;color:#fff}.status{margin:16px 0;color:#475569}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border:1px solid #dbe3ef;border-radius:18px;padding:19px;background:#fff}.card h2{font-size:20px;margin:0}.alias{font-size:12px;color:#64748b;margin:3px 0 11px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.tag{font-size:10px;border-radius:999px;padding:4px 7px;background:#eef2f7}.card dl{display:grid;grid-template-columns:72px 1fr;gap:6px 9px;margin:0}.card dt{font-weight:800;color:#475569}.card dd{margin:0}.ai{margin-top:12px;padding:10px;border-radius:10px;background:#0f172a;color:#e2e8f0;font:12px ui-monospace,monospace;overflow-wrap:anywhere}.source{padding:12px 14px;border-radius:12px;background:#f1f5f9;font-size:13px}@media(max-width:800px){.dictionary-shell{padding:28px 14px 65px}.grid{grid-template-columns:1fr}}</style></head><body><a class="skip-link" href="#main">本文へ移動</a><header class="site-header"><a class="brand" href="./"><span class="brand-mark">辞</span><span>漫画演出辞典</span></a><nav class="site-nav"><a href="./techniques.html">技法ガイド</a><a href="./guide.html">操作</a><a class="nav-cta" href="./editor.html">エディタ</a></nav></header><main id="main" class="dictionary-shell"><p class="eyebrow">MANGA DIRECTION DICTIONARY</p><h1>人間とAIが、同じ演出語彙を使う。</h1><p class="hero-lead dict-lead">このページはエディタ用Coreと同じ正規Knowledge Baseから直接生成しています。辞典だけ直ってAIが古い、AIだけ増えて人間が知らない、というズレを作りません。</p><p class="source"><b>Single Source of Truth:</b> <code>core/manga-knowledge.mjs</code>。検索は日本語名・英語ID・カテゴリ・効果・AI向け意味表現を横断します。</p><section class="dict-search"><input id="q" type="search" placeholder="例: 迫力 / fear / reveal / 寄り / scroll…" autocomplete="off"/><div id="filters" class="filters"></div></section><div id="status" class="status"></div><div id="grid" class="grid"></div></main><script type="module">import{TECHNIQUES,TERMS}from'../core/manga-knowledge.mjs';const q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),filters=document.querySelector('#filters');const jaByTechnique=Object.fromEntries(Object.values(TERMS).map(x=>[x.technique,x.ja]));const aliasesByTechnique={};for(const x of Object.values(TERMS)){(aliasesByTechnique[x.technique]??=[]).push(x.en)}const categoryJa={camera:'カメラ',composition:'構図',panel:'コマ',transition:'編集・遷移',pacing:'時間・テンポ',action:'動き・アクション',attention:'視線・情報',psychology:'心理',lettering:'文字・SFX',medium:'媒体固有'};const fallback=id=>id.split('-').map(x=>x[0]?.toUpperCase()+x.slice(1)).join(' ');const entries=Object.values(TECHNIQUES).map(t=>({id:t.id,name:jaByTechnique[t.id]||fallback(t.id),alias:(aliasesByTechnique[t.id]||[]).join(' / ')||fallback(t.id),cat:t.category,effects:t.effects||[],semantic:t.semantic||{},requires:t.requires||[],pairs:t.pairs||[],conflicts:t.conflicts||[]}));let active='';for(const cat of [...new Set(entries.map(e=>e.cat))]){const b=document.createElement('button');b.className='chip';b.textContent=categoryJa[cat]||cat;b.dataset.cat=cat;b.setAttribute('aria-pressed','false');filters.append(b)}const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const query=q.value.trim().toLowerCase().normalize('NFKC');const shown=entries.filter(e=>{const hay=[e.id,e.name,e.alias,e.cat,...e.effects,JSON.stringify(e.semantic),...e.requires,...e.pairs,...e.conflicts].join(' ').toLowerCase().normalize('NFKC');return(!active||e.cat===active)&&(!query||query.split(/\s+/).every(w=>hay.includes(w)))});status.textContent=`${shown.length} / ${entries.length} 技法${active?' — '+(categoryJa[active]||active):''}`;grid.innerHTML=shown.map(e=>`<article class="card"><h2>${esc(e.name)}</h2><div class="alias"><code>${esc(e.id)}</code> · ${esc(e.alias)}</div><div class="tags"><span class="tag">${esc(categoryJa[e.cat]||e.cat)}</span>${e.effects.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><dl><dt>狙い</dt><dd>${esc(e.effects.join(' / '))}</dd><dt>制約</dt><dd>${esc(e.requires.length?e.requires.join(', '):'媒体制約なし')}</dd><dt>相性</dt><dd>${esc(e.pairs.length?e.pairs.join(', '):'—')}</dd><dt>競合</dt><dd>${esc(e.conflicts.length?e.conflicts.join(', '):'—')}</dd></dl><div class="ai"><b>Machine semantics</b><br/>${esc(JSON.stringify(e.semantic))}</div></article>`).join('')}q.addEventListener('input',render);filters.addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;active=active===b.dataset.cat?'':b.dataset.cat;filters.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cat===active)));render()});render();</script></body></html>
